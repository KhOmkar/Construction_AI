# Class-Conditional DDPM with Classifier-Free Guidance (CFG) Configuration
model:
  type: "diffusion"
  name: "ddpm_cfg"
  input_resolution: 64
  in_channels: 3
  out_channels: 3
  base_channels: 64
  channel_mult: [1, 2, 2, 4] # Sized for 6GB VRAM
  attention_resolutions: [16] # Attention strictly at 16x16 to prevent OOM
  num_res_blocks: 2
  num_classes: 4
  cfg_dropout_prob: 0.10 # 10% label dropout during training
  beta_schedule: "cosine"
  timesteps: 1000

training:
  epochs: 100
  batch_size: 64 # Tier B optimized batch size
  gradient_accumulation_steps: 2 # Effective batch size = 128
  lr: 0.0001
  weight_decay: 0.00001
  ema_decay: 0.9999
  mixed_precision: "fp16"
  seed: 42
  num_workers: 0

sampling:
  default_steps: 50 # DDIM sampling
  fast_steps: 20 # Fast sampling mode for Streamlit live demo
  guidance_scale: 3.0

data:
  train_npz: "processed/crops/crops_train_64.npz"
  val_npz: "processed/crops/crops_val_64.npz"
  test_npz: "processed/crops/crops_test_64.npz"
  normalize_mode: "tanh" # [-1, 1] range

logging:
  run_dir: "runs/diffusion_baseline"
  save_every: 1
  keep_last: 5
  log_interval: 20
