# Autoencoder Configuration: Anomaly Detection on Compliant Crops
model:
  type: "autoencoder"
  name: "ae_anomaly"
  input_resolution: 64
  in_channels: 3
  bottleneck_dim: 256
  channels: [64, 128, 256, 512]
  loss: "mse_ssim" # combines MSE with SSIM
  ssim_weight: 0.20

training:
  epochs: 100
  batch_size: 128
  lr: 0.001
  weight_decay: 0.00001
  lr_scheduler: "cosine"
  mixed_precision: "fp16"
  seed: 42
  num_workers: 0
  filter_class: 0 # Train ONLY on compliant crops (wearing helmet and vest)

data:
  train_npz: "processed/crops/crops_train_64.npz"
  val_npz: "processed/crops/crops_val_64.npz"
  test_npz: "processed/crops/crops_test_64.npz"
  normalize_mode: "sigmoid" # [0, 1] range for reconstruction

logging:
  run_dir: "runs/ae_baseline"
  save_every: 1
  keep_last: 5
  log_interval: 20
