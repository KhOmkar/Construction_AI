services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: construction-site-ai-dashboard:latest
    container_name: construction_ai_dashboard
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
